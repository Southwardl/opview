plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "org.dragonpilot.opview"
    // match dashy: explicit SDK versions for old headunit compat
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "org.dragonpilot.opview"
        minSdk = 21          // Android 5.0 — pinned, do NOT use flutter.minSdkVersion (floats to 24+)
        targetSdk = 34
        versionCode = 1
        versionName = "0.1.1"
    }

    // include 32-bit ARM + x86 for old headunits (Intel Atom Android 6)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            universalApk true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
        // JIT-release mode — used for 32-bit x86 targets (no AOT artifacts)
        jitRelease {
            initWith release
        }
    }
}

flutter {
    source = "../.."
}
